prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}

grafana:
  enabled: true
  adminPassword: "changeme"
  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    logLevel: info
    replicas: 1
    externalUrl: ""

# Enable PrometheusRule CRD creation from values if preferred
prometheusRule:
  enabled: true
  rules:
    groups:
      - name: sample-app.rules
        rules:
          - alert: High5xxRate
            expr: |
              sum(increase(http_requests_total{status=~"5.."}[5m])) / sum(increase(http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate"
              description: "More than 5% of requests are returning 5xx in the last 5 minutes."

          - alert: PodRestartHigh
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod restart detected"
              description: "Pod has restarted recently."


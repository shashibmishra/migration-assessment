global:
  resolve_timeout: 5m

route:
  receiver: 'on-call'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'on-call'
    webhook_configs:
      - url: 'https://example.com/alert' # replace with your webhook or Slack/Email integration

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
